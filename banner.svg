<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>

  <!-- decorative waves -->
  <path d="M0 200 C 200 160, 400 240, 600 200 S 900 160, 1000 190 L1000 260 L0 260 Z" fill="#00D4FF" opacity="0.08"/>
  <path d="M0 225 C 250 190, 450 255, 700 220 S 920 195, 1000 215 L1000 260 L0 260 Z" fill="#7C3AED" opacity="0.10"/>

  <text x="500" y="112" text-anchor="middle"
