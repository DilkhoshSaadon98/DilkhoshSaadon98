  <rect x="380" y="130" width="240" height="4" rx="2" fill="url(#accent)"/>

  <text x="500" y="172" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" fill="#00D4FF">Mobile &amp; Full-Stack Developer</text>

  <text x="500" y="212" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="18" fill="#CBD5E1">Flutter · Dart · PHP · MySQL · Firebase · Arduino</text>
</svg>
